<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131f"/>
      <stop offset="50%" stop-color="#18152e"/>
      <stop offset="100%" stop-color="#0e0f18"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="200" cy="200" r="160" fill="#7c3aed" opacity="0.16" filter="url(#softGlow)"/>

  <!-- Outer Ring with Gradient -->
  <circle cx="200" cy="200" r="172" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="12 6" opacity="0.85"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#3b3267" stroke-width="1.5"/>

  <!-- Main avatar base -->
  <circle cx="200" cy="200" r="150" fill="url(#avatarBg)"/>

  <!-- Decorative geometric code accents -->
  <g stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <path d="M 120 160 L 95 200 L 120 240" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 280 160 L 305 200 L 280 240" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="160" y1="280" x2="240" y2="280" stroke-linecap="round" stroke-dasharray="4 4"/>
  </g>

  <!-- Monogram Initials "MR" -->
  <text x="200" y="222" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="78" font-weight="800" text-anchor="middle" fill="url(#textGrad)" letter-spacing="2">MR</text>

  <!-- Subtitle badge inside circle -->
  <rect x="130" y="250" width="140" height="24" rx="12" fill="#1f1c3d" stroke="#6366f1" stroke-width="1"/>
  <text x="200" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c7d2fe" letter-spacing="1">FULL-STACK DEV</text>

  <!-- Status dot ring at bottom right -->
  <circle cx="308" cy="308" r="24" fill="#0d0e17" stroke="#252440" stroke-width="3"/>
  <circle cx="308" cy="308" r="12" fill="#10b981"/>
  <circle cx="308" cy="308" r="6" fill="#ecfdf5"/>
</svg>
