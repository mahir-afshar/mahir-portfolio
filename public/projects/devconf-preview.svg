<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d14"/>
      <stop offset="50%" stop-color="#131226"/>
      <stop offset="100%" stop-color="#181330"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1c38" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#141324" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Glow effect -->
  <circle cx="680" cy="80" r="140" fill="#7c3aed" opacity="0.18" filter="blur(40px)"/>
  <circle cx="120" cy="380" r="160" fill="#6366f1" opacity="0.12" filter="blur(40px)"/>

  <!-- Browser Window Mockup -->
  <rect x="60" y="40" width="680" height="370" rx="12" fill="#0d0e17" stroke="#2d2850" stroke-width="1.5"/>
  
  <!-- Browser Header -->
  <rect x="60" y="40" width="680" height="42" rx="12" fill="#141322"/>
  <rect x="60" y="70" width="680" height="12" fill="#141322"/>
  <circle cx="85" cy="61" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="102" cy="61" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="119" cy="61" r="5" fill="#10b981" opacity="0.8"/>
  
  <!-- URL Bar -->
  <rect x="150" y="50" width="340" height="22" rx="6" fill="#1e1c33" stroke="#2c2a47" stroke-width="1"/>
  <text x="165" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">devconf2026.global/keynotes</text>

  <!-- Page Content -->
  <!-- Hero Section of Demo -->
  <rect x="90" y="105" width="130" height="24" rx="12" fill="url(#violetGrad)" opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
  <text x="105" y="121" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd">OCTOBER 2026</text>
  
  <text x="90" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff">DevConf 2026</text>
  <text x="90" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Connecting Engineers &amp; Modern Web Architects</text>

  <!-- Action CTA -->
  <rect x="90" y="215" width="120" height="32" rx="6" fill="url(#violetGrad)"/>
  <text x="118" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Register Now</text>

  <rect x="220" y="215" width="105" height="32" rx="6" fill="#1e1c36" stroke="#37306b" stroke-width="1"/>
  <text x="245" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Schedule</text>

  <!-- Schedule / Speaker Cards Preview -->
  <rect x="420" y="105" width="290" height="85" rx="8" fill="url(#cardGrad)" stroke="#312e5c" stroke-width="1"/>
  <circle cx="450" cy="147" r="18" fill="#8b5cf6" opacity="0.4"/>
  <text x="444" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ddd6fe">JS</text>
  <text x="480" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Keynote: Future of Web Dev</text>
  <text x="480" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a1a1aa">Main Stage • 10:00 AM</text>

  <rect x="420" y="205" width="290" height="85" rx="8" fill="url(#cardGrad)" stroke="#312e5c" stroke-width="1"/>
  <circle cx="450" cy="247" r="18" fill="#6366f1" opacity="0.4"/>
  <text x="443" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#c7d2fe">UI</text>
  <text x="480" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Building Resilient UI Components</text>
  <text x="480" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a1a1aa">Track B • 11:30 AM</text>

  <!-- Bottom Stats bar inside preview -->
  <rect x="90" y="295" width="620" height="80" rx="8" fill="#121122" stroke="#24213d" stroke-width="1"/>
  <text x="120" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#a78bfa">40+</text>
  <text x="120" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#71717a">Tech Sessions</text>

  <text x="260" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#818cf8">1,200+</text>
  <text x="260" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#71717a">Attendees</text>

  <text x="400" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#a855f7">18</text>
  <text x="400" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#71717a">Keynote Speakers</text>

  <text x="540" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">100%</text>
  <text x="540" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#71717a">Responsive Layout</text>
</svg>
