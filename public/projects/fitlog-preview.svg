<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#181433"/>
    </linearGradient>
    <linearGradient id="glowPurp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#fitBg)"/>

  <!-- Ambient light -->
  <circle cx="700" cy="120" r="140" fill="#8b5cf6" opacity="0.12" filter="blur(40px)"/>
  <circle cx="100" cy="360" r="140" fill="#06b6d4" opacity="0.10" filter="blur(40px)"/>

  <!-- Window Container -->
  <rect x="60" y="40" width="680" height="370" rx="12" fill="#0d111a" stroke="#252e42" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="60" y="40" width="680" height="42" rx="12" fill="#131926"/>
  <rect x="60" y="70" width="680" height="12" fill="#131926"/>
  <circle cx="85" cy="61" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="102" cy="61" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="119" cy="61" r="5" fill="#10b981" opacity="0.8"/>

  <text x="150" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">Fit Log // Fitness &amp; Activity Tracker</text>

  <!-- In-development banner overlay -->
  <rect x="520" y="50" width="200" height="24" rx="12" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="535" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#c7d2fe">● IN ACTIVE DEVELOPMENT</text>

  <!-- Left Stats & Summary -->
  <rect x="85" y="100" width="200" height="130" rx="8" fill="#121824" stroke="#232d3f" stroke-width="1"/>
  <text x="105" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Active Streak</text>
  <text x="105" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff">18 Days</text>
  <text x="105" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#10b981">↑ +4 workouts this week</text>

  <rect x="85" y="245" width="200" height="140" rx="8" fill="#121824" stroke="#232d3f" stroke-width="1"/>
  <text x="105" y="273" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Target Burn Goal</text>
  <text x="105" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#a78bfa">640 kcal</text>
  <!-- Mini Progress bar -->
  <rect x="105" y="335" width="160" height="8" rx="4" fill="#202738"/>
  <rect x="105" y="335" width="128" height="8" rx="4" fill="url(#glowPurp)"/>
  <text x="105" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">80% completed today</text>

  <!-- Right Chart & Activity log -->
  <rect x="300" y="100" width="420" height="285" rx="8" fill="#101520" stroke="#232d3f" stroke-width="1"/>
  <text x="325" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Weekly Workout Volume</text>
  
  <!-- Bar chart graphics -->
  <g transform="translate(325, 160)">
    <!-- Mon -->
    <rect x="20" y="60" width="28" height="90" rx="4" fill="#3b4252"/>
    <text x="24" y="165" font-family="monospace" font-size="10" fill="#64748b">MON</text>
    <!-- Tue -->
    <rect x="68" y="30" width="28" height="120" rx="4" fill="#7c3aed"/>
    <text x="73" y="165" font-family="monospace" font-size="10" fill="#64748b">TUE</text>
    <!-- Wed -->
    <rect x="116" y="80" width="28" height="70" rx="4" fill="#3b4252"/>
    <text x="120" y="165" font-family="monospace" font-size="10" fill="#64748b">WED</text>
    <!-- Thu -->
    <rect x="164" y="20" width="28" height="130" rx="4" fill="#8b5cf6"/>
    <text x="169" y="165" font-family="monospace" font-size="10" fill="#64748b">THU</text>
    <!-- Fri -->
    <rect x="212" y="45" width="28" height="105" rx="4" fill="#7c3aed"/>
    <text x="219" y="165" font-family="monospace" font-size="10" fill="#64748b">FRI</text>
    <!-- Sat -->
    <rect x="260" y="10" width="28" height="140" rx="4" fill="#a855f7"/>
    <text x="266" y="165" font-family="monospace" font-size="10" fill="#a78bfa">SAT</text>
    <!-- Sun -->
    <rect x="308" y="90" width="28" height="60" rx="4" fill="#3b4252"/>
    <text x="313" y="165" font-family="monospace" font-size="10" fill="#64748b">SUN</text>
  </g>
</svg>
